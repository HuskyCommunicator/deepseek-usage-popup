<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>DeepSeek 用量</title>
<HTA:APPLICATION
  ID="dsApp"
  APPLICATIONNAME="DeepSeek"
  BORDER="thin"
  CAPTION="yes"
  SHOWINTASKBAR="no"
  SINGLEINSTANCE="yes"
  SYSMENU="no"
  SCROLL="no"
  INNERBORDER="no"
  MAXIMIZEBUTTON="no"
  MINIMIZEBUTTON="no"
  WINDOWSTATE="normal"
/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #15171c; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: #e8eaed;
    -ms-user-select: none; user-select: none;
    overflow: hidden;
    cursor: default;
  }
  .wrap { padding: 16px 20px 13px; }

  .head {
    display: -ms-flexbox; display: flex;
    -ms-flex-align: baseline; align-items: baseline;
    -ms-flex-pack: justify; justify-content: space-between;
    margin-bottom: 13px;
  }
  .title { font-size: 14px; font-weight: 600; letter-spacing: .2px; }
  .title .dot { color: #4d8dff; margin-right: 7px; font-size: 12px; }
  .tag {
    font-size: 10.5px; color: #7b828d;
    background: #1f232b; border-radius: 9px;
    padding: 2px 9px;
  }

  .row {
    display: -ms-flexbox; display: flex;
    -ms-flex-pack: justify; justify-content: space-between;
    -ms-flex-align: baseline; align-items: baseline;
    padding: 5px 0;
  }
  .row .k { color: #8b929d; font-size: 12.5px; }
  .row .v { font-size: 14px; font-weight: 600; }
  .cny { font-size: 11px; font-weight: 400; color: #6f7681; margin-right: 3px; }

  .big .k { font-size: 13px; }
  .big .v { font-size: 20px; letter-spacing: .2px; }
  .money .v { color: #4ddbb0; }
  .spend .v { color: #ffb454; }

  .mono .v { font-family: Consolas, "Cascadia Mono", "Courier New", monospace; font-size: 13px; color: #cfd4dc; font-weight: 500; }

  .hr { height: 1px; background: #24282f; margin: 8px 0; }

  .bar-wrap { margin-top: 9px; }
  .bar-head {
    display: -ms-flexbox; display: flex;
    -ms-flex-pack: justify; justify-content: space-between;
    -ms-flex-align: baseline; align-items: baseline;
    margin-bottom: 7px;
  }
  .bar-head .k { color: #8b929d; font-size: 12.5px; }
  .bar-head .v { color: #3fd68c; font-size: 13px; font-weight: 600; }
  .bar { height: 7px; background: #232730; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #3fd68c; border-radius: 4px; }

  .foot {
    margin-top: 14px; padding-top: 10px;
    border-top: 1px solid #21242b;
    display: -ms-flexbox; display: flex;
    -ms-flex-pack: justify; justify-content: space-between;
    font-size: 10.5px; color: #666d78;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="title"><span class="dot">&#9670;</span>DeepSeek 用量</div>
    <div class="tag">{{DATE}}</div>
  </div>

  <div class="row big money"><div class="k">剩余余额</div><div class="v"><span class="cny">CNY</span>{{BALANCE}}</div></div>
  <div class="row big spend"><div class="k">今日消费</div><div class="v"><span class="cny">CNY</span>{{COST}}</div></div>

  <div class="hr"></div>

  <div class="row"><div class="k">请求次数</div><div class="v">{{REQ}} 次</div></div>
  <div class="row mono"><div class="k">输入 Token</div><div class="v">{{IN_TOK}}</div></div>
  <div class="row mono"><div class="k">输出 Token</div><div class="v">{{OUT_TOK}}</div></div>
  <div class="row mono"><div class="k">缓存读取</div><div class="v">{{CACHE}}</div></div>
  <div class="row mono"><div class="k">Tokens 合计</div><div class="v">{{TOTAL}}</div></div>

  <div class="bar-wrap">
    <div class="bar-head"><div class="k">缓存命中率</div><div class="v">{{HIT_PCT}}%</div></div>
    <div class="bar"><i style="width:{{HIT_PCT}}%"></i></div>
  </div>

  <div class="foot"><span>{{SOURCE}}</span><span>Esc 关闭</span></div>
</div>

<script language="JavaScript">
  // 先把窗口缩到窄，量出内容真实高度再定尺寸，避免不同 DPI 下被裁
  window.resizeTo(316, 200);
  window.moveTo(-2000, -2000);
  setTimeout(function () {
    var w = 316;
    var h = document.documentElement.scrollHeight + 38;
    window.resizeTo(w, h);
    window.moveTo(Math.max(0, (screen.availWidth  - w) / 2),
                  Math.max(0, (screen.availHeight - h) / 2));
    window.focus();
  }, 30);

  // Esc / 空格 / 回车 关闭
  document.onkeydown = function (e) {
    var k = window.event ? window.event.keyCode : e.keyCode;
    if (k === 27 || k === 13 || k === 32) { window.close(); return false; }
  };
</script>
</body>
</html>
